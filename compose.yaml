services:
  backend:
    build: ./backend
    volumes:
      - terrain-cache:/app/data/dem/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          from urllib.request import urlopen
          def health(path):
              with urlopen("http://127.0.0.1:8000" + path, timeout=3) as response:
                  return json.load(response)
          if not health("/api/v1/health")["kernels_ready"] or not health("/api/health")["maps_loaded"]:
              raise SystemExit(1)
      interval: 5s
      timeout: 8s
      retries: 6
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${LUNAR_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  terrain-cache:
