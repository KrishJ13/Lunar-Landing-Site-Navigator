[project]
name = "lunar-navigator-backend"
version = "0.1.0"
description = "Backend for the Lunar Landing Site Navigator: terrain, horizons and sky geometry."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "certifi>=2024",  # CA bundle for downloading from PDS (python.org macOS builds lack one)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "spiceypy>=8,<9",  # JPL SPICE (lunar_sky); kernels via scripts/download_kernels.py
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",  # only for scripts/ray_section.py / skyline_plot.py debug plots
]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lunar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_data: needs downloaded LOLA elevation files (run scripts/fetch_dem.py first)",
    "network: reads LOLA data from the PDS server; runs only with LUNAR_NETWORK_TESTS=1",
]
